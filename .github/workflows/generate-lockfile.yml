name: Lockfile generieren

on:
  push:
    branches: [ci-lockfile]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install (Lockfile erzeugen)
        run: bun install

      - name: bun.lock committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- bun.lock bun.lockb)" ]; then
            git add bun.lock bun.lockb 2>/dev/null || git add bun.lock
            git commit -m "chore: bun.lock erzeugen und einchecken"
            git push
          else
            echo "Lockfile unverändert"
          fi
