name: E2E-Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (${{ matrix.project }})
    # ubuntu-latest ist seit 19.10.2026 Ubuntu 26; das gepinnte Playwright
    # 1.56 unterstuetzt dessen Browser-Abhaengigkeiten nicht.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [public, authenticated]
    env:
      E2E_BASE_URL: http://localhost:8080
      # Die App ist lokal-first (IndexedDB) und braucht keine Secrets mehr.
      # KI-Funktionen sind ohne Schlüssel deaktiviert; die Tests prüfen die
      # Pfade, die ohne KI-Schlüssel funktionieren.
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bun-Cache konfigurieren
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Abhängigkeiten installieren
        # Ohne --frozen-lockfile: bun.lock ist nicht eingecheckt.
        run: bun install

      # Playwright-Version ermitteln (vor dem Cache-Schritt, da der Key davon
      # abhängt) — Chromium ist mehrere hundert MB groß und ändert sich nur,
      # wenn sich die Playwright-Version ändert.
      - name: Playwright-Version ermitteln
        id: pw-version
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser-Cache konfigurieren
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Browser installieren
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: E2E-Tests ausführen
        run: |
          set -o pipefail
          bunx playwright test --project=${{ matrix.project }} 2>&1 | tee e2e-output.txt

      # TEMPORAER: Fehler-Log als Issue posten, damit der Fehlertext ohne
      # Log-Zugriff analysierbar ist. Nach Gruenwerden wieder entfernen.
      - name: Fehler in Issue dokumentieren
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg project "${{ matrix.project }}" --arg run "${{ github.run_number }}" --rawfile body e2e-output.txt \
            '{title: ("CI-Fehler: E2E (" + $project + ", Run " + $run + ")"), body: ($body[-55000:])}' > /tmp/payload.json
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d @/tmp/payload.json

      - name: Report hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Bei Fehlschlag zusätzlich Traces/Videos/Screenshots separat hochladen,
      # damit sie ohne den kompletten HTML-Report abrufbar sind.
      - name: Traces hochladen (nur bei Fehlern)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces-${{ matrix.project }}
          path: |
            test-results/**/trace.zip
            test-results/**/*.webm
            test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore
